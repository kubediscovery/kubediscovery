replicaCount: 1

image:
  repository: registry.synera.com.br/kubediscovery/docspage
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

gateway:
  enabled: true
  gatewayName: https
  gatewayNamespace: envoy-gateway
  sectionName: kubediscovery
  hostnames:
    - docs.kubediscovery.com
  pathPrefix: /
